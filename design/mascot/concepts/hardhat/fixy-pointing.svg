      <circle id="glove" cx="0" cy="62" r="20" fill="#F6F1E7" stroke="#0F1C2E" stroke-width="6" stroke-linejoin="round"/>
    </g>
    <g id="arm-right" transform="translate(314 348) rotate(-26)">
      <path d="M0 0V62" stroke="#0F1C2E" stroke-width="34" stroke-linecap="round"/>
      <path d="M0 0V62" stroke="#B8C0CB" stroke-width="22" stroke-linecap="round"/>
      <path id="wrench" fill="#B8C0CB" stroke="#0F1C2E" stroke-width="6" stroke-linejoin="round" transform="translate(0 62) rotate(38) translate(0 -62) scale(0.85)" d="M-10 -26.2A28 28 0 0 0 -8 26.8V96A8 8 0 0 0 8 96V26.8A28 28 0 0 0 10 -26.2V0A10 10 0 0 1 -10 0Z"/>
