<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Fixy: thinking</title>
  <desc>Looking and scanning while the vision model runs. "Let me look..."</desc>
  <defs>
    <clipPath id="clip-glass"><circle cx="256" cy="272" r="86"/></clipPath>
    <clipPath id="clip-lid"><circle cx="256" cy="272" r="88"/></clipPath>
  </defs>
  <g id="shadow">
    <ellipse cx="256" cy="464" rx="132" ry="13" fill="#0F1C2E" opacity="0.14"/>
  </g>
  <g id="fixy">
    <g id="feet" fill="#0F1C2E">
      <ellipse id="foot-left" cx="202" cy="442" rx="40" ry="22"/>
      <ellipse id="foot-right" cx="310" cy="442" rx="40" ry="22"/>
    </g>
    <g id="arm-left">
      <path id="arm-left-limb" d="M118 322L83.5 366.1" fill="none" stroke="#0F1C2E" stroke-width="28" stroke-linecap="round"/>
      <path id="arm-left-hand" transform="translate(83.5 366.1) rotate(218)" fill="#0F1C2E" d="M-10 -26.2A28 28 0 1 0 10 -26.2V0A10 10 0 0 1 -10 0Z"/>
    </g>
    <g id="arm-right">
      <path id="arm-right-limb" d="M394 322L428.5 366.1" fill="none" stroke="#0F1C2E" stroke-width="28" stroke-linecap="round"/>
      <path id="arm-right-hand" transform="translate(428.5 366.1) rotate(142)" fill="#0F1C2E" d="M-10 -26.2A28 28 0 1 0 10 -26.2V0A10 10 0 0 1 -10 0Z"/>
    </g>
    <g id="antenna" fill="#0F1C2E">
      <rect id="antenna-stem" x="245" y="112" width="22" height="50" rx="11"/>
      <path id="antenna-jaw" transform="translate(256 110) scale(1.1)" d="M-10 -26.2A28 28 0 1 0 10 -26.2V0A10 10 0 0 1 -10 0Z"/>
    </g>
    <g id="body">
      <ellipse id="body-shell" cx="256" cy="292" rx="150" ry="138" fill="#0F1C2E"/>
    </g>
    <g id="eye">
      <circle id="eye-glass" cx="256" cy="272" r="86" fill="#F6F1E7"/>
      <g id="pupil" clip-path="url(#clip-glass)">
        <circle id="iris" cx="280" cy="250" r="50" fill="#FF9F1C"/>
        <circle id="pupil-core" cx="280" cy="250" r="20" fill="#0F1C2E"/>
        <circle id="catchlight" cx="260" cy="230" r="11" fill="#F6F1E7"/>
      </g>
    </g>
    <g id="eyelid" clip-path="url(#clip-lid)" fill="#0F1C2E">
      <path id="lid-upper" d="M166 182H346V206Q256 222 166 222Z"/>
      <path id="lid-lower" d="M166 362H346V380Q256 336 166 380Z"/>
    </g>
    <g id="mouth">
      <path d="M244 398Q258 394 276 398" fill="none" stroke="#F6F1E7" stroke-width="10" stroke-linecap="round"/>
    </g>
  </g>
  <g id="fx">
    <circle cx="392" cy="150" r="10" fill="#FF9F1C"/>
    <circle cx="422" cy="118" r="13" fill="#FF9F1C"/>
    <circle cx="458" cy="82" r="16" fill="#FF9F1C"/>
  </g>
</svg>
