<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Fixy: happy</title>
  <desc>Celebrating a finished repair step.</desc>
  <defs>
    <clipPath id="clip-glass"><circle cx="256" cy="272" r="86"/></clipPath>
    <clipPath id="clip-lid"><circle cx="256" cy="272" r="88"/></clipPath>
  </defs>
  <g id="shadow">
    <ellipse cx="256" cy="464" rx="132" ry="13" fill="#0F1C2E" opacity="0.14"/>
  </g>
  <g id="fixy">
    <g id="feet" fill="#0F1C2E">
      <ellipse id="foot-left" cx="202" cy="442" rx="40" ry="22"/>
      <ellipse id="foot-right" cx="310" cy="442" rx="40" ry="22"/>
    </g>
    <g id="arm-left">
      <path id="arm-left-limb" d="M118 322L71.2 270" fill="none" stroke="#0F1C2E" stroke-width="28" stroke-linecap="round"/>
      <path id="arm-left-hand" transform="translate(71.2 270) rotate(-42)" fill="#0F1C2E" d="M-10 -26.2A28 28 0 1 0 10 -26.2V0A10 10 0 0 1 -10 0Z"/>
    </g>
    <g id="arm-right">
      <path id="arm-right-limb" d="M394 322L440.8 270" fill="none" stroke="#0F1C2E" stroke-width="28" stroke-linecap="round"/>
      <path id="arm-right-hand" transform="translate(440.8 270) rotate(42)" fill="#0F1C2E" d="M-10 -26.2A28 28 0 1 0 10 -26.2V0A10 10 0 0 1 -10 0Z"/>
    </g>
    <g id="antenna" fill="#0F1C2E">
      <rect id="antenna-stem" x="245" y="112" width="22" height="50" rx="11"/>
      <path id="antenna-jaw" transform="translate(256 110) scale(1.1)" d="M-10 -26.2A28 28 0 1 0 10 -26.2V0A10 10 0 0 1 -10 0Z"/>
    </g>
    <g id="body">
      <ellipse id="body-shell" cx="256" cy="292" rx="150" ry="138" fill="#0F1C2E"/>
    </g>
    <g id="eye">
      <circle id="eye-glass" cx="256" cy="272" r="86" fill="#F6F1E7"/>
      <g id="pupil" clip-path="url(#clip-glass)">
        <circle id="iris" cx="256" cy="266" r="50" fill="#FF9F1C"/>
        <circle id="pupil-core" cx="256" cy="266" r="21" fill="#0F1C2E"/>
        <circle id="catchlight" cx="236" cy="246" r="11" fill="#F6F1E7"/>
      </g>
    </g>
    <g id="eyelid" clip-path="url(#clip-lid)" fill="#0F1C2E">
      <path id="lid-upper" d="M166 182H346V186Q256 206 166 186Z"/>
      <path id="lid-lower" d="M166 362V338A150 150 0 0 1 346 338V362Z"/>
    </g>
    <g id="mouth">
      <path id="mouth-open" d="M224 384Q256 391 288 384Q285 414 256 414Q227 414 224 384Z" fill="#FF9F1C" stroke="#FF9F1C" stroke-width="6" stroke-linejoin="round"/>
    </g>
  </g>
  <g id="fx">
    <circle cx="96" cy="120" r="9" fill="#FF9F1C"/>
    <rect x="139" y="65" width="22" height="10" rx="5" fill="#FF9F1C" transform="rotate(0 150 70)"/>
    <circle cx="368" cy="70" r="8" fill="#FF9F1C"/>
    <rect x="409" y="115" width="22" height="10" rx="5" fill="#FF9F1C" transform="rotate(30 420 120)"/>
    <rect x="55" y="195" width="22" height="10" rx="5" fill="#FF9F1C" transform="rotate(-20 66 200)"/>
    <circle cx="450" cy="206" r="10" fill="#FF9F1C"/>
  </g>
</svg>
