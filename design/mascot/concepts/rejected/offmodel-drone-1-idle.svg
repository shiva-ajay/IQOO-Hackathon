        <path fill="#0F1C2E" d="M146 258h12l-14 14h-12zM172 258h12l-14 14h-12zM198 258h12l-14 14h-12zM224 258h12l-14 14h-12zM250 258h12l-14 14h-12zM276 258h12l-14 14h-12zM302 258h12l-14 14h-12zM328 258h12l-14 14h-12zM354 258h12l-14 14h-12z"/>
