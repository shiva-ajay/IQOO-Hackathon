      <ellipse cx="394" cy="173" rx="50" ry="16" fill="#0F1C2E"/>
      <ellipse id="rotor-right-blur" cx="394" cy="172" rx="46" ry="9" fill="#F6F1E7" opacity="0.55"/>
      <circle cx="394" cy="198" r="5" fill="#FF9F1C"/>
