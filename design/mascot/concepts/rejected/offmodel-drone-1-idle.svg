      <ellipse cx="118" cy="176" rx="64" ry="26" fill="#F6F1E7" stroke="#F6F1E7" stroke-width="20" stroke-linejoin="round"/>
      <ellipse cx="394" cy="176" rx="64" ry="26" fill="#F6F1E7" stroke="#F6F1E7" stroke-width="20" stroke-linejoin="round"/>
      <circle cx="256" cy="322" r="30" fill="#F6F1E7" stroke="#F6F1E7" stroke-width="20" stroke-linejoin="round"/>
    </g>
